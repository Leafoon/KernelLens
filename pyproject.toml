[project]
name = "kernellens-agent"
version = "0.1.0"
description = "An evidence-grounded AI agent for developing and optimizing TileLang kernels."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.5",
    "textual==8.2.8",
]

[project.scripts]
kernellens = "kernellens.cli:main"

[project.urls]
Repository = "https://github.com/Leafoon/KernelLens"
Documentation = "https://github.com/Leafoon/KernelLens/blob/main/docs/cli.md"
Issues = "https://github.com/Leafoon/KernelLens/issues"

[build-system]
requires = ["uv_build==0.11.23"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kernellens"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["kernellens"]

[dependency-groups]
dev = [
    "ruff==0.16.6",
]
